<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Silog Express is a meal ordering and inventory system for silog meals, drinks, stock tracking, and order management."
    />
    <title>Silog Express — Meal Ordering System</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes light.
      try {
        var savedTheme = localStorage.getItem("stockpilot.theme");
        if (savedTheme !== "light") document.documentElement.classList.add("dark");
      } catch (e) {
        /* storage blocked — dark stays the default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
