services:
  mongo:
    image: mongo:8
    container_name: stockpilot-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"   # reachable from this machine only
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
